name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this before it publishes, so a release is gated on the same
  # matrix that gates a merge. A tag must never publish what main would have rejected.
  workflow_call:

jobs:
  test:
    # Windows is the point of this matrix, not an afterthought. The target machine is
    # a Windows desktop, junctions and USERPROFILE only exist there, and every path
    # bug this project has had would have been caught here first.
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # node:sqlite ships in Node core from 22.5. Assert it rather than discover it
      # through a confusing failure three steps later.
      - name: Verify node:sqlite is present
        run: node -e "const s=require('node:sqlite'); if(!s.DatabaseSync) throw new Error('no DatabaseSync'); console.log('node',process.versions.node,'sqlite ok')"

      # The staleness tests build a throwaway repository and count commits in it.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # Zero runtime dependencies is the claim the README leads with, and the reason
      # this passes review on a locked-down desktop. A claim nothing enforces is one
      # that quietly stops being true the first time someone runs --save.
      - name: Assert zero runtime dependencies
        shell: bash
        run: |
          n=$(node -p "Object.keys(require('./package.json').dependencies||{}).length")
          test "$n" -eq 0 || { echo "::error::$n runtime dependencies; this package must have none"; exit 1; }
          npm audit --audit-level=low

      - name: Test
        run: npm test

  install:
    name: install from tarball / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A tarball install is a true copy, which is what a registry or git-URL install
      # actually does. Installing the directory would symlink and prove less.
      - name: Pack and install globally
        shell: bash
        run: |
          set -euo pipefail
          tgz=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)
          npm install -g --allow-scripts=@vib795/agent-memory "$RUNNER_TEMP/$tgz"

      - name: Setup installs only where a tool is present
        shell: bash
        env:
          AGENT_MEMORY_HOME: ${{ runner.temp }}/store
          AGENT_MEMORY_SKILLS_HOME: ${{ runner.temp }}/skills
        run: |
          set -euo pipefail
          H="$AGENT_MEMORY_SKILLS_HOME"

          # A bare machine: only the shared convention directory. Writing into
          # ~/.claude here would be inventing an install for a tool that is absent.
          agent-memory setup
          for s in handoff recall remember; do
            test -f "$H/.agents/skills/$s/SKILL.md" || { echo "missing .agents/$s"; exit 1; }
          done
          test ! -e "$H/.claude" || { echo "wrote to .claude with no Claude Code present"; exit 1; }

          # Now with Claude Code, Codex and VS Code "installed".
          mkdir -p "$H/.claude" "$H/.codex"
          case "$RUNNER_OS" in
            macOS)   VSC="$H/Library/Application Support/Code/User" ;;
            Windows) VSC="$H/AppData/Roaming/Code/User" ;;
            *)       VSC="$H/.config/Code/User" ;;
          esac
          mkdir -p "$VSC"
          agent-memory setup

          for s in handoff recall remember; do
            test -f "$H/.claude/skills/$s/SKILL.md" || { echo "missing .claude/$s"; exit 1; }
            test -f "$H/.codex/skills/$s/SKILL.md"  || { echo "missing .codex/$s"; exit 1; }
            test -f "$VSC/prompts/$s.prompt.md"     || { echo "missing prompt file $s"; exit 1; }
            grep -q 'generated by agent-memory' "$VSC/prompts/$s.prompt.md" \
              || { echo "$s.prompt.md lacks the ownership marker"; exit 1; }
            head -2 "$VSC/prompts/$s.prompt.md" | grep -q '^mode: agent$' \
              || { echo "$s.prompt.md lacks prompt-file frontmatter"; exit 1; }
          done

          agent-memory doctor

      - name: Write, retrieve, and rebuild the index
        shell: bash
        env:
          AGENT_MEMORY_HOME: ${{ runner.temp }}/store
          AGENT_MEMORY_SKILLS_HOME: ${{ runner.temp }}/skills
        run: |
          set -euo pipefail
          # Assembled rather than written out. This value has to match the
          # github-token pattern for the check to mean anything, which also means it
          # matches every credential scanner pointed at this repository.
          TOKEN="ghp_$(printf 'a%.0s' $(seq 36))"
          cat > "$RUNNER_TEMP/nodes.json" <<JSON
          {"nodes":[
            {"id":"ci-smoke","type":"system","title":"CI smoke note",
             "body":"Written by CI to prove the round trip. Token $TOKEN must not survive.",
             "edges":[{"rel":"depends-on","dst":"ci-constraint"}]},
            {"id":"ci-constraint","type":"constraint","title":"CI constraint note",
             "body":"Constraints are never dropped from a truncated tree."}
          ]}
          JSON
          agent-memory write --from-json "$RUNNER_TEMP/nodes.json"
          agent-memory tree
          agent-memory get ci-smoke --depth 1
          agent-memory search "round trip"

          # Redaction must have fired before anything reached disk.
          if grep -rq "$TOKEN" "$AGENT_MEMORY_HOME"; then
            echo "raw token found on disk"; exit 1
          fi

          # The index is a cache: deleting it must change nothing.
          before=$(agent-memory get ci-smoke --depth 1 --json)
          rm -f "$AGENT_MEMORY_HOME/index.db" "$AGENT_MEMORY_HOME"/index.db-*
          agent-memory index
          test "$before" = "$(agent-memory get ci-smoke --depth 1 --json)" \
            || { echo "output changed after rebuild"; exit 1; }

      - name: Uninstall leaves no dangling links and keeps notes
        shell: bash
        env:
          AGENT_MEMORY_HOME: ${{ runner.temp }}/store
          AGENT_MEMORY_SKILLS_HOME: ${{ runner.temp }}/skills
        run: |
          set -euo pipefail
          H="$AGENT_MEMORY_SKILLS_HOME"
          case "$RUNNER_OS" in
            macOS)   VSC="$H/Library/Application Support/Code/User" ;;
            Windows) VSC="$H/AppData/Roaming/Code/User" ;;
            *)       VSC="$H/.config/Code/User" ;;
          esac

          # A prompt file we did not write must survive: ownership is decided by the
          # generated marker, never by the filename.
          printf -- '---\nmode: agent\n---\nhand written, not ours\n' > "$VSC/prompts/mine.prompt.md"

          agent-memory uninstall
          for s in handoff recall remember; do
            test ! -e "$H/.agents/skills/$s"   || { echo "$s skill survived uninstall"; exit 1; }
            test ! -e "$H/.claude/skills/$s"   || { echo "$s claude skill survived"; exit 1; }
            test ! -e "$H/.codex/skills/$s"    || { echo "$s codex skill survived"; exit 1; }
            test ! -e "$VSC/prompts/$s.prompt.md" || { echo "$s prompt file survived"; exit 1; }
          done
          test -f "$VSC/prompts/mine.prompt.md" \
            || { echo "uninstall deleted a prompt file it did not write"; exit 1; }
          test -f "$AGENT_MEMORY_HOME/notes/system/ci-smoke.md" \
            || { echo "uninstall destroyed a note"; exit 1; }

  # The README tells anyone behind a proxy that blocks or quarantines npm to clone
  # the repository and install that directory. For one release the documented
  # command was `npm install -g <git-url>` instead, which does not work at all: npm
  # links the package into ~/.npm/_cacache/tmp/git-clone*, deletes that directory,
  # and postinstall dies with "Cannot find module". Nothing here noticed, because
  # the job above only ever installs the packed tarball. A documented install path
  # that nothing exercises is a claim, not a feature — so exercise it.
  clone-install:
    name: clone install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the checkout as a directory, the way the README says
        shell: bash
        env:
          AGENT_MEMORY_HOME: ${{ runner.temp }}/clone-store
          AGENT_MEMORY_SKILLS_HOME: ${{ runner.temp }}/clone-home
        run: |
          set -euo pipefail
          # actions/checkout is itself a clone. Copying it out of the workspace makes
          # this the documented "clone somewhere, install that directory" rather than
          # an install of the tree npm is already standing in.
          clone="$RUNNER_TEMP/agent-memory-clone"
          rm -rf "$clone"
          cp -R "$GITHUB_WORKSPACE" "$clone"
          rm -rf "$clone/node_modules"

          npm install -g "$clone"

          # The bug this guards against reports a successful install and leaves no
          # files behind, so assert on the files rather than on the exit code. If the
          # package ever resolves into a transient cache directory again, these fail.
          # npm on Windows answers with a CRLF and backslashes, and a backslash is an
          # escape character in bash. Normalise both or every check below silently
          # tests a path that cannot exist.
          root="$(npm root -g | tr -d '\r' | tr '\\' '/')"
          pkg="$root/@vib795/agent-memory"
          for f in package.json src/cli.js scripts/postinstall.js skills/recall/SKILL.md; do
            test -f "$pkg/$f" || { echo "::error::$f is missing from the install at $pkg"; exit 1; }
          done

          # npm gates postinstall behind allow-scripts, so setup is the documented
          # second command here exactly as it is for a registry install.
          agent-memory setup
          for s in handoff recall remember; do
            test -f "$AGENT_MEMORY_SKILLS_HOME/.agents/skills/$s/SKILL.md" \
              || { echo "::error::$s not linked by setup"; exit 1; }
          done

          # doctor's `skills installed` check is fatal, so this fails the job if the
          # CLI landed on PATH while every agent directory stayed empty.
          agent-memory doctor

      # install.ps1 has no test runner and cannot be parsed on the machine it was
      # written on, so a syntax error in it would first be discovered by a user.
      - name: Parse install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:RUNNER_TEMP\agent-memory-clone\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parses clean"

      # install.ps1 is the documented Windows entry point and it broke on a real
      # managed desktop: npm warns on stderr about an unknown config key, `2>&1` turns
      # that warning into an ErrorRecord, and $ErrorActionPreference = 'Stop' makes it
      # terminating — so the script aborted before doctor over a warning about an
      # unrelated key. A clean runner cannot catch that, because npm there is silent.
      # Seed the warning, then assert the script reaches its last line.
      - name: install.ps1 survives an npm config warning
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENT_MEMORY_HOME: ${{ runner.temp }}/ps1-store
          AGENT_MEMORY_SKILLS_HOME: ${{ runner.temp }}/ps1-home
        run: |
          # An unknown key makes npm warn on stderr on every invocation, which is what a
          # managed desktop looks like. Ask npm where its user config lives rather than
          # assuming ~/.npmrc: this runner uses a custom prefix, and a seed written to
          # the wrong file produces no warning and a test that proves nothing. The key
          # is deliberately nonsense — `always-auth` is what broke the real desktop, but
          # some npm versions still recognise it, and this test needs a guaranteed warn.
          $userconfig = (& npm config get userconfig 2>&1 | Out-String).Trim()
          Write-Host "npm userconfig: $userconfig"
          Add-Content -Path $userconfig -Value "agent-memory-seeded-unknown-key=1"

          # Prove the seed before trusting it. install.ps1 sends npm through Out-Null,
          # so a warning is invisible from the outside — if npm ever stops emitting one
          # this test would keep passing while guarding nothing at all, which is worse
          # than not having it. Assert the condition exists, then assert we survive it.
          $probe = & npm ls -g --depth=0 2>&1 | Out-String
          Write-Host "probe: $probe"
          if ($probe -notmatch 'Unknown user config') {
            Write-Host "::error::the npm warning this test depends on did not appear; it would pass vacuously"
            exit 1
          }

          $out = & powershell -ExecutionPolicy Bypass `
            -File "$env:RUNNER_TEMP\agent-memory-clone\install.ps1" 2>&1 | Out-String
          Write-Host $out

          # Reaching the closing line is the assertion: every earlier step is allowed
          # to fail on a locked-down desktop, but the script must not abandon the user
          # mid-run without printing doctor or telling them what to do next.
          if ($out -notmatch 'Restart VS Code') {
            Write-Host "::error::install.ps1 stopped before its closing message"
            exit 1
          }
          if ($out -notmatch 'Installed for') {
            Write-Host "::error::install.ps1 linked no skills"
            exit 1
          }
